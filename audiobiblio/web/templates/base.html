<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}audiobiblio{% endblock %}</title>
    <link rel="stylesheet" href="/static/audiobiblio.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
    <script src="/static/audiobiblio.js"></script>
</head>
<body>
    <header>
        <div class="inner">
            <div>
                <h1><a href="/">audiobiblio</a></h1>
                <div class="subtitle">audiobooks under control</div>
            </div>
            <nav>
                <a href="/" {% if active == 'home' %}class="active"{% endif %}>Overview</a>
                <a href="/inbox" {% if active in ('inbox', 'shelf_queue', 'import', 'dedupe', 'chaos_dups') %}class="active"{% endif %}>Worklist
                    <span hx-get="/_partials/inbox_badge" hx-trigger="load, every 30s" hx-swap="innerHTML"></span></a>
                <a href="/jobs" {% if active in ('jobs', 'gaps') %}class="active"{% endif %}>Downloads</a>
                <a href="/library" {% if active == 'library' or active == 'episodes' %}class="active"{% endif %}>Library</a>
                <a href="/programs" {% if active in ('programs', 'targets') %}class="active"{% endif %}>Programs</a>
                <details class="nav-more">
                    <summary>&#9881; Tools</summary>
                    <div class="nav-more-menu">
                        <a href="/shelf-queue" {% if active == 'shelf_queue' %}class="active"{% endif %}>Shelf queue</a>
                        <a href="/gaps" {% if active == 'gaps' %}class="active"{% endif %}>Gaps</a>
                        <a href="/import" {% if active == 'import' %}class="active"{% endif %}>Import findings</a>
                        <a href="/dedupe" {% if active == 'dedupe' %}class="active"{% endif %}>Duplicate works</a>
                        <a href="/chaos-dups" {% if active == 'chaos_dups' %}class="active"{% endif %}>Duplicate files</a>
                        <a href="/targets" {% if active == 'targets' %}class="active"{% endif %}>Sources</a>
                        <a href="/catalog" {% if active == 'catalog' %}class="active"{% endif %}>Catalog rebuild</a>
                        <a href="/segmentation" {% if active == 'segmentation' %}class="active"{% endif %}>Segmentation</a>
                        <a href="/logs" {% if active == 'logs' %}class="active"{% endif %}>Logs</a>
                        <a href="/system" {% if active == 'system' %}class="active"{% endif %}>System</a>
                    </div>
                </details>
            </nav>
            <form action="/search" method="get" class="nav-search" role="search">
                <input type="search" name="q" value="{{ q or '' }}" placeholder="Search…" aria-label="Search">
            </form>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <span hx-get="/_partials/stats" hx-trigger="load, every 30s" hx-swap="innerHTML" id="footer-stats"></span>
    </footer>
</body>
</html>
